services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-libraryhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-libraryhub}
      POSTGRES_DB: ${POSTGRES_DB:-libraryhub}
      TZ: Europe/Moscow
      PGTZ: Europe/Moscow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://${POSTGRES_USER:-libraryhub}:${POSTGRES_PASSWORD:-libraryhub}@db:5432/${POSTGRES_DB:-libraryhub}?sslmode=disable
      DB_TIMEOUT: ${DB_TIMEOUT:-5s}
      TZ: Europe/Moscow
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
